[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lottodata"
version = "1.2.0"
description = "Lottery draw archives for Austrian Lotto, German Lotto, EuroMillions, and Eurojackpot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
]

[tool.setuptools]
packages = []

name: Update AT Lotto 6 aus 45

on:
  schedule:
    # Austria: Sunday, Wednesday, and possible Friday bonus draws. All cron times are UTC.
    - cron: "17 20 * * 0,3,5"
  workflow_dispatch:
    inputs:
      init:
        description: "Full archive import (2000 to the current year)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  update:
    permissions:
      contents: write
    uses: ./.github/workflows/_update_lottery.yml
    with:
      game: at
      init: ${{ inputs.init || false }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

name: Deploy GitHub Pages

on:
  # workflow_run also fires when update commits use GITHUB_TOKEN, which
  # intentionally does not trigger another push workflow.
  workflow_run:
    workflows:
      - Unit Tests
      - Update AT Lotto 6 aus 45
      - Update DE Lotto 6 aus 49
      - Update EU EuroMillions
      - Update EU Eurojackpot
      - Update All CSVs
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Only trusted default-branch runs may deploy. Never check out or consume
    # artifacts from the branch supplied by a pull request.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install project
        uses: ./.github/actions/setup-project
        with:
          enable-cache: "false"

      - name: Validate the revision being published
        run: |
          uv run --locked python -m unittest discover -s tests
          uv run --locked python scripts/check_integrity.py --skip-stale

      - name: Generate index.html and downloadable archives
        run: uv run --locked python scripts/generate_page.py

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

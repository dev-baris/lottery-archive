name: Set up lottery archive
description: Install Python and the dependencies recorded in uv.lock.

inputs:
  python-version:
    description: Optional Python override; otherwise use .python-version.
    required: false
    default: ""
  enable-cache:
    description: Whether to use the uv dependency cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        python-version-file: .python-version
        check-latest: true

    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: "0.12.17"
        enable-cache: ${{ inputs.enable-cache }}
        cache-dependency-glob: uv.lock
        cache-suffix: ${{ steps.python.outputs.python-version }}

    - name: Install locked dependencies
      shell: bash
      env:
        PROJECT_PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        printf 'UV_PYTHON=%s\n' "$PROJECT_PYTHON" >> "$GITHUB_ENV"
        export UV_PYTHON="$PROJECT_PYTHON"
        uv sync --locked
